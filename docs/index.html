<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Ranking FOMO</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Concepto: columna de móvil. Modo oscuro por defecto (fondo negro, naranja FOMO como destaque) y modo claro con el tema blanco del manual. Podio con disco de ajedrez, filetes de 2px, sin sombras ni degradados. El modo lo elige el botón de la cabecera (atributo data-fomo), no el sistema. */
:root{
  --brand:#FFAB61;--brand-deep:#D68E51;--ink:#0A0A0A;--paper:#FFFFFF;
  --accent:#FFAB61;--on-accent:#0A0A0A;
  --surface:#0A0A0A;--card:#1B1714;--fill-4:#2B2118;--text:#F7F1EA;--muted:#CDBBA8;--line:#6F6256;
  --sheet:#141110;--input:#0A0A0A;--panel:#1B1714;--on-panel:#F7F1EA;--panel-line:#6F6256;
  --pri-bg:#FFAB61;--pri-text:#0A0A0A;--nav-bg:#1B1714;--nav-text:#F7F1EA;--nav-line:#6F6256;
  --focus:#FFAB61;--toast-bg:#FFAB61;--toast-text:#0A0A0A;
  --sans:"Poppins","Helvetica Neue",Arial,sans-serif;--serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:40px;--s6:64px;
  --r-sm:6px;--r-md:12px;--r-lg:24px;--r-full:999px;
  color-scheme:dark;
}
:root[data-fomo="light"]{
  --surface:#FFFFFF;--card:#FFF1E3;--fill-4:#FFE2C6;--text:#0A0A0A;--muted:#5C4A3A;--line:#0A0A0A;
  --sheet:#FFFFFF;--input:#FFFFFF;--panel:#0A0A0A;--on-panel:#FFFFFF;--panel-line:#0A0A0A;
  --pri-bg:#0A0A0A;--pri-text:#FFFFFF;--nav-bg:#0A0A0A;--nav-text:#FFFFFF;--nav-line:#0A0A0A;
  --focus:#0A0A0A;--toast-bg:#0A0A0A;--toast-text:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--surface);min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--surface);color:var(--text);font:400 15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.05em}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:12px 170px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px;padding-block:8px 16px}
.logo{width:44px;height:44px;border-radius:var(--r-full);border:2px solid var(--line);object-fit:cover;background:var(--brand);flex:none}
.top .name{font-weight:700;letter-spacing:-.03em;font-size:17px;line-height:1.1}
.top .sub{font-size:12px;color:var(--muted)}
.sp{flex:1}
.iconbtn{width:44px;height:44px;border-radius:var(--r-full);border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:var(--r-full);padding:2px 10px;font-size:12px;font-weight:600;letter-spacing:.02em;background:var(--card);white-space:nowrap}
.pill.ink{background:var(--accent);color:var(--on-accent)}
.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.04em;line-height:1.02;text-wrap:balance}
h1{font-size:38px}
h2{font-size:22px}
.muted{color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{border:2px solid var(--line);background:transparent;border-radius:var(--r-full);padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap;min-height:36px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.head{display:grid;gap:8px;margin-bottom:16px}
.head .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.podium{background:var(--panel);color:var(--on-panel);border:2px solid var(--panel-line);border-radius:var(--r-lg);padding:28px 12px 0;overflow:hidden;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:end;gap:6px;margin-bottom:16px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;background:none;border:0;color:inherit;padding:0;width:100%}
.disc{display:grid;place-items:center;border-radius:var(--r-full);width:140px;height:140px;background:conic-gradient(var(--panel) 25%,var(--brand) 0 50%,var(--panel) 0 75%,var(--brand) 0) 0 0/48px 48px}
.ph{border-radius:var(--r-full);object-fit:cover;background:var(--fill-4);display:block}
.pod .ph{width:76px;height:76px;border:2px solid var(--on-panel)}
.pod.w .ph{width:112px;height:112px;border:3px solid var(--panel)}
.pod.empty .ph{background:transparent;border:2px dashed rgba(255,255,255,.4)}
.pod b{font-size:13px;font-weight:600;letter-spacing:-.01em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:8px}
.pod .pts{font-size:12px;color:var(--brand);font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:8px}
.pod .tg{font-size:11px;opacity:.8;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:6px;font-weight:700;font-size:28px;letter-spacing:-.04em;color:var(--ink);background:var(--brand-deep)}
.pod.w .step{background:var(--brand)}
.s1{height:96px}.s2{height:64px}.s3{height:44px}
.s2,.s3{background:var(--brand-deep)}

.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-md);padding:16px}
.mine{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin-bottom:16px}
.mine .th{width:64px;height:64px}
.big{font-size:34px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.tally{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.list{display:grid;gap:8px;margin-top:12px}
.row{display:grid;grid-template-columns:34px 56px 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r-md);padding:8px 12px 8px 8px;width:100%;text-align:left}
.row.me{background:var(--fill-4)}
.rk{font-weight:700;font-size:20px;letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;border:2px solid var(--line);background:var(--fill-4);display:block}
.row .who{min-width:0}
.row .who b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who span{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font-weight:700;font-size:18px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-align:right}
.row .sc small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0}

.empty{background:var(--panel);color:var(--on-panel);border:2px solid var(--panel-line);border-radius:var(--r-lg);padding:28px 20px;display:grid;gap:12px;justify-items:center;text-align:center;margin-bottom:16px}
.empty .disc{width:96px;height:96px}
.empty h2{font-size:24px}
.empty p{margin:0;opacity:.85}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:var(--r-full);padding:10px 20px;min-height:44px;font-weight:600;background:var(--card);color:var(--text)}
.btn.pri{background:var(--pri-bg);color:var(--pri-text);border-color:var(--pri-bg)}
.btn.brand{background:var(--brand)}
.btn.ig{justify-self:start;text-decoration:none;color:var(--ink);max-width:100%}
.btn.ig b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.armed{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cta{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:8px 16px 4px;background:var(--surface);z-index:15;pointer-events:none}
.cta .btn{pointer-events:auto;max-width:448px;width:100%}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);z-index:20}
.nav .bar{pointer-events:auto;display:flex;gap:4px;background:var(--nav-bg);border:2px solid var(--nav-line);border-radius:var(--r-full);padding:6px;width:100%;max-width:448px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--nav-text);padding:8px 4px;border-radius:var(--r-full);font-size:11px;font-weight:600;letter-spacing:.02em;min-height:52px}
.nav button[aria-current=page]{background:var(--brand);color:var(--ink)}

.budget{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);margin-inline:-16px;padding:8px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.bud{background:var(--card);border:2px solid var(--line);border-radius:var(--r-md);padding:8px 10px;display:grid;gap:2px;justify-items:start}
.bud b{font-size:12px;font-weight:600}
.dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:var(--r-full);border:2px solid var(--accent);background:var(--accent)}
.dot.off{background:transparent}
.feed{display:grid;gap:20px}
.vc{background:var(--card);border:2px solid var(--line);border-radius:var(--r-lg);padding:8px;display:grid;gap:8px}
.vimg{position:relative;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:var(--fill-4);border:2px solid var(--line)}
.vimg img{width:100%;height:100%;object-fit:cover;display:block}
.stk{display:inline-flex;gap:6px;align-items:center;background:var(--paper);color:#0A0A0A;border:2px solid #0A0A0A;border-radius:var(--r-sm);padding:4px 10px;font-size:13px;font-weight:600;max-width:100%;min-height:32px}
.stickers{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.vbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vb{display:grid;justify-items:center;gap:4px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:10px 4px;font-size:12px;font-weight:600;min-height:64px}
.vb[aria-pressed=true]{background:var(--text);color:var(--surface);border-color:var(--text)}
.vb.like[aria-pressed=true]{background:var(--brand-deep);color:#0A0A0A;border-color:var(--brand-deep)}
.vb.love[aria-pressed=true]{background:var(--brand);color:#0A0A0A;border-color:var(--brand)}
.vb.off{opacity:.45}

.prof{display:grid;gap:16px}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.av{border-radius:var(--r-full);object-fit:cover;border:2px solid var(--line);background:var(--fill-4);display:grid;place-items:center;font-weight:700;color:var(--text);flex:none}
.av.lg{width:88px;height:88px;font-size:34px}
.pcard h1{font-size:30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{position:relative;aspect-ratio:4/5;border:2px solid var(--line);border-radius:var(--r-md);overflow:hidden;padding:0;background:var(--fill-4)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .stk{position:absolute;left:4px;bottom:4px;padding:2px 8px;min-height:24px;font-size:11px}
.sec{display:grid;gap:8px}

.seg{display:flex;gap:8px;margin-bottom:12px}
.arow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r-md);padding:10px}
.arow .who{min-width:0}
.arow .who b{display:block;overflow-wrap:anywhere}
.arow .who span{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.arow .th{width:48px;height:48px}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ctc{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;font-weight:600;font-size:13px}
.ctc a{color:var(--text)}

#sheet .scrim{position:fixed;inset:0;background:rgba(10,10,10,.62);z-index:30}
#sheet .panel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:92%;overflow:auto;background:var(--sheet);color:var(--text);border:2px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:31;display:grid;gap:16px}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.shead h2{font-size:28px}
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.field input,.field textarea{border:2px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--input);width:100%}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.role{border:2px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:12px;font-weight:600;min-height:48px}
.role[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.avpick{display:flex;gap:16px;align-items:center}
.drop{display:grid;place-items:center;gap:8px;text-align:center;border:2px dashed var(--line);border-radius:var(--r-md);padding:16px;background:var(--fill-4);min-height:140px;cursor:pointer}
.drop img{max-height:280px;max-width:100%;border-radius:var(--r-md);border:2px solid var(--line)}
.taglist{display:grid;gap:6px;max-height:200px;overflow:auto}
.tagopt{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:var(--r-md);background:var(--card);padding:6px 10px;text-align:left;min-height:48px}
.tagopt[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tagopt .av{width:32px;height:32px;font-size:14px}
.err{margin:0;border:2px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;background:var(--fill-4);font-weight:600}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-full);background:var(--accent);color:var(--on-accent);font-weight:700}
.steps b{display:block}
.pimg{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:16px;border:2px solid var(--line);background:var(--fill-4);display:block}
.kv{display:flex;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-text);border-radius:var(--r-full);padding:10px 18px;font-weight:600;font-size:14px;z-index:50;max-width:calc(100% - 32px);text-align:center;display:none}
#toast.show{display:block}
.note{font-size:13px;color:var(--muted);margin:0}
.rules{background:var(--fill-4);border:2px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:6px;font-size:13px}
.rules b{font-size:14px}
.rules ul{margin:0;padding-left:18px;display:grid;gap:2px}

/* Animaciones sencillas: entran al cambiar de pantalla, no en cada actualización de datos */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
main.enter>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}
main.enter>*:nth-child(3){animation-delay:.1s}
main.enter>*:nth-child(4){animation-delay:.15s}
main.enter>*:nth-child(5){animation-delay:.2s}
main.enter>*:nth-child(n+6){animation-delay:.25s}
main.enter .step{transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
main.enter .s1{animation-delay:.08s}
main.enter .s2{animation-delay:.18s}
main.enter .s3{animation-delay:.26s}
main.enter .pod.w .disc{animation:pop .6s .45s both}
#sheet .scrim{animation:fade .2s both}
#sheet .panel{animation:sheetUp .28s cubic-bezier(.2,.7,.2,1) both}
#toast.show{animation:toastIn .22s both}
.btn,.vb,.chip,.role,.tagopt,.iconbtn,.row,.tile,.pod,.nav button{transition:transform .12s ease,background-color .15s ease,color .15s ease}
.btn:active,.vb:active,.chip:active,.role:active,.tagopt:active,.iconbtn:active,.row:active,.tile:active,.pod:active,.nav button:active{transform:scale(.96)}
.vb.pop{animation:pop .35s ease}
.dot{transition:background-color .2s ease}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>

cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',

function applyTheme(t){document.documentElement.setAttribute('data-fomo',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#FFFFFF':'#0A0A0A')}

/* ---------- utilidades ---------- */
var urlCache=new Map();
function dataToUrl(d){if(!d)return '';var u=urlCache.get(d);if(u!==undefined)return u;try{var b=atob(d.split(',')[1]);var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);u=URL.createObjectURL(new Blob([a],{type:'image/jpeg'}))}catch(e){u=''}urlCache.set(d,u);return u}
function hash(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return h}
function slug(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'quedada'}
function fmtDate(d){try{return new Date(d+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'})}catch(e){return d||''}}
var toastT=0;
function toast(m){var t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},3400)}
var raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;draw()})}
function bump(){S.cache={};render()}
function nm(uid){var p=S.profiles.get(uid);return p?p.name:'Usuario eliminado'}
function avatar(uid,size,cls){var p=S.profiles.get(uid);var st='width:'+size+'px;height:'+size+'px';if(p&&p.avatar)return '<img class="av '+(cls||'')+'" style="'+st+'" src="'+p.avatar+'" alt="">';var c=p&&p.name?p.name.trim().charAt(0).toUpperCase():'?';return '<span class="av '+(cls||'')+'" style="'+st+';font-size:'+Math.round(size*.42)+'px" aria-hidden="true">'+esc(c)+'</span>'}
function evList(){return Array.from(S.events.values()).sort(function(a,b){return (b.date||'').localeCompare(a.date||'')})}
function curEvent(){var l=evList();if(!l.length)return null;var e=S.events.get(S.eventId);if(e)return e;return l.find(function(x){return x.status==='open'})||l[0]}
function me(){return S.profiles.get(S.uid)}
function needsOnboard(){return false}

/* ---------- ranking ---------- */
function tally(evId){
 var k='t'+evId;if(S.cache[k])return S.cache[k];
 var out=new Map();
 S.photos.forEach(function(p){if(p.eventId!==evId)return;var c=S.counts[p.id]||{};var o={love:+c.love||0,like:+c.like||0,dislike:+c.dislike||0};o.pts=o.love*W.love+o.like*W.like+o.dislike*W.dislike;out.set(p.id,o)});
 return S.cache[k]=out;
}
function rankFor(evId){
 var k='r'+evId;if(S.cache[k])return S.cache[k];
 var t=tally(evId);var arr=[];
 S.photos.forEach(function(p){if(p.eventId===evId){var o=t.get(p.id)||{pts:0,love:0,like:0,dislike:0};arr.push({p:p,pts:o.pts,love:o.love,like:o.like,dislike:o.dislike})}});
 arr.sort(function(a,b){return b.pts-a.pts||b.love-a.love||b.like-a.like||a.dislike-b.dislike||a.p.createdAt-b.p.createdAt});
 arr.forEach(function(r,i){r.rank=i+1});
 return S.cache[k]=arr;
}
function myVotes(evId){var out={};for(var pid in S.myVotesMap){var p=S.photos.get(pid);var t=S.myVotesMap[pid];if(p&&p.eventId===evId&&CAP[t]!==undefined)out[pid]=t}return out}
function usage(evId){var u={love:0,like:0,dislike:0};var m=myVotes(evId);for(var k in m)u[m[k]]++;return u}
function myCount(evId){var n=0;S.photos.forEach(function(p){if(p.eventId===evId&&p.authorId===S.uid)n++});return n}

function accentTitle(prefix,name){var parts=String(name).trim().split(/\s+/);var last=parts.pop()||'';return esc(prefix)+' '+(parts.length?esc(parts.join(' '))+' ':'')+'<em>'+esc(last)+'</em>'}

 (S.isAdmin?'<span class="pill ink">Admin</span>':'')+

}
function podium(rows){
 var slots=[rows[1],rows[0],rows[2]];var cls=['','w',''];var st=['s2','s1','s3'];var n=['2','1','3'];
 return '<section class="podium" aria-label="Podio">'+slots.map(function(r,i){
  if(!r)return '<div class="pod empty"><span class="ph"></span><b>&nbsp;</b><span class="pts">&nbsp;</span><div class="step '+st[i]+'">'+n[i]+'</div></div>';
  var img='<img class="ph" src="'+r.p.thumb+'" alt="Foto de '+esc(nm(r.p.authorId))+'">';
  var tg=r.p.taggedId&&S.profiles.has(r.p.taggedId)?'<span class="tg">con '+esc(nm(r.p.taggedId))+'</span>':'';
  return '<button class="pod '+cls[i]+'" data-act="photo" data-id="'+esc(r.p.id)+'">'+(i===1?'<span class="disc">'+img+'</span>':img)+
  '<b>'+esc(nm(r.p.authorId))+'</b>'+tg+'<span class="pts">'+nf.format(r.pts)+' pts</span><div class="step '+st[i]+'">'+n[i]+'</div></button>';
 }).join('')+'</section>';
}
function tallyChips(r){return '<div class="tally"><span class="pill">'+ic(P.heart,14)+' '+r.love+'</span><span class="pill">'+ic(P.up,14)+' '+r.like+'</span><span class="pill">'+ic(P.down,14)+' '+r.dislike+'</span></div>'}
function rowHtml(r){

 var tg=r.p.taggedId&&S.profiles.has(r.p.taggedId)?'con '+esc(nm(r.p.taggedId)):(S.profiles.get(r.p.authorId)?ROLE[S.profiles.get(r.p.authorId).role]:'');

}

 if(!ev)return '<div class="empty"><span class="disc"></span><h2>Todavía no hay <em>quedadas</em></h2><p>Cuando un admin cree la primera, aparecerá aquí su ranking.</p></div>';

 if(!rows.length){h+='<div class="empty"><span class="disc"></span><h2>La primera foto marca el <em>listón</em></h2><p>Aún no hay nada en este ranking. Sube la tuya y anima al resto.</p></div>'}
 else h+=podium(rows);

 var contact='';
 if(isMe){contact=S.myContact?'<div class="ctc">'+esc(S.myContact)+'<span class="note">· solo lo ven los admins</span></div>':'<p class="note">Tu contacto solo lo ven los admins.</p>'}

 return '<div class="prof"><div class="pcard">'+avatar(uid,88,'lg')+'<div><span class="cap">'+ROLE[p.role]+(S.admins.has(uid)?' · Admin':'')+'</span><h1>'+esc(p.name)+'</h1></div></div>'+
 (p.bio?'<p style="margin:0">'+esc(p.bio)+'</p>':'')+(p.instagram?'<a class="btn brand ig" href="https://www.instagram.com/'+esc(p.instagram)+'/" target="_blank" rel="noopener noreferrer">'+ic(P.insta,18)+' Ver Instagram <b>@'+esc(p.instagram)+'</b></a>':(isMe?'<p class="note">Añade tu Instagram en Editar perfil y la gente podrá ir a verlo con un botón.</p>':''))+contact+btns+
 '<div class="sec"><h2>Fotos en <em>competición</em></h2>'+(mine.length?'<div class="grid">'+mine.map(tile).join('')+'</div>':'<p class="note">'+(isMe?'Todavía no has subido ninguna. Entra en Ranking y pulsa Subir foto.':'Aún no ha subido fotos.')+'</p>')+'</div>'+

async function loadBmp(file){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){return await new Promise(function(res,rej){var u=URL.createObjectURL(file);var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=u})}}
function encode(src,max,q,limit,square){
 var sw=src.width,sh=src.height,sx=0,sy=0;
 if(square){var s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=s;sh=s}
 var k=Math.min(1,max/Math.max(sw,sh));var w=Math.round(sw*k),h=Math.round(sh*k);
 var c=document.createElement('canvas'),x=c.getContext('2d');var url='';
 for(var tries=0;tries<12;tries++){c.width=w;c.height=h;x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(src,sx,sy,sw,sh,0,0,w,h);url=c.toDataURL('image/jpeg',q);if(url.length<=limit)return url;if(q>0.5)q-=0.08;else{w=Math.round(w*.85);h=Math.round(h*.85)}}
 return url.length<=limit?url:'';
}

 if(name.length<2)return showErr('f-err','Escribe tu nombre (mínimo 2 letras).');
 if(!/^\d{4,6}$/.test(pin))return showErr('f-err','El PIN son entre 4 y 6 números.');
 var req={action:reg?'register':'login',nombre:name,pin:pin};
 if(reg){
  var code=$('#f-code').value.trim(),contact=$('#f-contact').value.trim();
  if(!code)return showErr('f-err','Pide el código de la comunidad a un admin.');
  if(contact.length<6)return showErr('f-err','Añade tu WhatsApp o teléfono. Solo lo ven los admins.');
  var ig=$('#f-insta').value.trim();if(ig&&!igNorm(ig))return showErr('f-err','Ese usuario de Instagram no parece válido. Ejemplo: @fomosevilla');
  req.instagram=ig;req.code=code;req.rol=S.form.role;req.bio=$('#f-bio').value.trim();req.contacto=contact;req.avatar=S.form.avatar||'';
 }
 var btn=$('#f-go');btn.disabled=true;btn.textContent=reg?'Creando…':'Entrando…';
 var r=await api(req);
 if(!r.ok){btn.disabled=false;btn.textContent=reg?'Crear mi cuenta':'Entrar';return showErr('f-err',r.error||'No se pudo completar.')}
 S.token=r.token;saveToken(r.token);S.loaded=false;render();
 var ok=await refresh();
 if(ok&&S.uid){S.tab='ranking';toast(reg?'Cuenta creada. ¡Bienvenide!':'¡Hola otra vez!');setInterval(function(){if(S.uid&&!document.hidden)refresh(true)},20000);if(reg)setTimeout(function(){openSheet({type:'help'})},300)}

 if(myCount(ev.id)>=ev.maxPhotos)return showErr('up-err','Ya has subido el máximo de fotos a esta quedada.');
 if(!S.up.full||S.up.busy)return;
 var btn=$('#up-go');btn.disabled=true;btn.textContent='Subiendo…';S.up.busy=true;
 var r=await api({action:'upload',evento:ev.id,etiquetado:S.up.taggedId||'',foto:S.up.full});
 if(!r.ok){S.up.busy=false;btn.disabled=false;btn.textContent='Presentar al ranking';return showErr('up-err',r.error||'No se pudo subir la foto. Inténtalo otra vez.')}
 await refresh();closeSheet();S.tab='ranking';render();
 setTimeout(function(){var rows=rankFor(ev.id);var q=rows.find(function(x){return x.p.id===r.id});toast(q?'Foto presentada. Vas el nº '+q.rank+' de '+rows.length+'.':'Foto presentada.')},500);

function castVote(pid,t){
 var ev=curEvent();if(!ev||ev.status!=='open')return toast('Esta quedada está cerrada.');
 var p=S.photos.get(pid);if(!p||p.authorId===S.uid||p.taggedId===S.uid)return;
 var cur=myVotes(ev.id);var next=cur[pid]===t?null:t;
 if(next){var u=usage(ev.id);if(cur[pid])u[cur[pid]]--;if(u[next]>=CAP[next])return toast('Ya has usado tu '+(CAP[next]>1?CAP[next]+' ':'')+'"'+LAB[next]+'". Quita uno para repartirlo de nuevo.')}
 var c=S.counts[pid]=S.counts[pid]||{love:0,like:0,dislike:0};
 if(cur[pid])c[cur[pid]]=Math.max(0,(c[cur[pid]]||0)-1);
 if(next){c[next]=(c[next]||0)+1;S.myVotesMap[pid]=next}else delete S.myVotesMap[pid];
 S.cache={};S.pop=next?pid+'|'+next:null;render();
 S.pending++;
 api({action:'vote',evento:ev.id,foto:pid,tipo:next}).then(function(r){
  S.pending--;
  if(r.ok){if(S.pending===0){S.counts=r.counts||S.counts;S.myVotesMap=r.myVotes||S.myVotesMap;S.cache={};render()}}
  else{toast(r.error||'No se pudo guardar tu voto.');if(S.pending===0)refresh()}
 });
}

 reload:function(){S.netErr='';render();refresh()},
 delEvent:function(el){if(arm(el,'delEvent','Borrar y quitar sus fotos')){deleteEvent(el.dataset.id)}},
 delUser:function(el){if(arm(el,'delUser','Confirmar')){deleteUser(el.dataset.id)}},
 delPhoto:function(el){if(arm(el,'delPhoto',el.dataset.close?'Pulsa otra vez para borrar':'Confirmar')){deletePhoto(el.dataset.id).then(function(ok){if(ok&&el.dataset.close)closeSheet()})}},
 copy:function(el){var t=el.dataset.text;var done=function(){toast('Copiado.')};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){toast(t)})}else toast(t)}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var f=A[el.dataset.act];if(f){f(el,e)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.sheet&&S.sheet.type!=='onboard')closeSheet()});
document.addEventListener('input',function(e){if(e.target.id==='up-q'){S.up.q=e.target.value;renderTagList()}});
document.addEventListener('change',function(e){
 var t=e.target;var f=t.files&&t.files[0];if(!f)return;
 if(t.id==='f-avatar'){
  loadBmp(f).then(function(b){var d=encode(b,256,.8,45000,true);if(!d)return showErr('f-err','No se pudo preparar esa foto.');S.form.avatar=d;document.getElementById('f-prev').innerHTML='<img class="av" style="width:72px;height:72px" src="'+dataToUrl(d)+'" alt="">'}).catch(function(){showErr('f-err','No se pudo leer esa imagen.')});
 }
 if(t.id==='up-file'){
  var prev=document.getElementById('up-prev'),go=document.getElementById('up-go');prev.innerHTML='Preparando foto…';go.disabled=true;
  loadBmp(f).then(function(b){var full=encode(b,1100,.84,185000),th=encode(b,360,.72,32000);if(!full||!th){prev.innerHTML='<b>Esa foto es demasiado pesada.</b><br>Prueba con otra.';return}S.up.full=full;S.up.thumb=th;prev.innerHTML='<img src="'+dataToUrl(full)+'" alt="Vista previa"><br><span class="note">Toca para cambiar la foto</span>';go.disabled=false}).catch(function(){prev.innerHTML='<b>No se pudo leer esa imagen.</b><br>Prueba con otra.'});
 }
});

/* ---------- datos (Google Sheets vía Apps Script) ---------- */
var CFG=window.FOMO_CONFIG||{};
var TOKEN_KEY='fomo-token';
function gimg(id,w){return id?'https://lh3.googleusercontent.com/d/'+encodeURIComponent(id)+'=w'+w:''}
function saveToken(t){try{if(t)localStorage.setItem(TOKEN_KEY,t);else localStorage.removeItem(TOKEN_KEY)}catch(e){}}
async function api(req){
 if(S.token&&!req.token)req.token=S.token;
 try{
  var res=await fetch(CFG.API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(req)});
  return await res.json();
 }catch(e){return {ok:false,code:'network',error:'No hay conexión con el servidor. Inténtalo otra vez.'}}
}
function applyState(r){
 if(!r.me){ if(S.token){saveToken('');S.token=''} S.uid=null; S.isAdmin=false; S.loaded=true; S.netErr=''; return }
 S.uid=r.me.id;S.isAdmin=!!r.me.admin;S.myContact=r.me.contacto||undefined;S.meName=r.me.nombre||'';
 var pm=new Map(),ad=new Set(),ct=new Map();
 (r.users||[]).forEach(function(u){
  pm.set(u.id,{id:u.id,name:str(u.nombre,40),role:u.rol==='modelo'?'modelo':'fotografo',bio:str(u.bio,200),instagram:igNorm(u.instagram),avatar:gimg(u.avatar,160),createdAt:+u.creado||0});
  if(u.admin)ad.add(u.id);if(u.contacto)ct.set(u.id,str(u.contacto,80));
 });
 var em=new Map();(r.events||[]).forEach(function(e){em.set(e.id,{id:e.id,name:str(e.nombre,40)||'Quedada',date:str(e.fecha,10),status:e.estado==='closed'?'closed':'open',maxPhotos:clamp(+e.max||3,1,10)})});
 var ph=new Map();(r.photos||[]).forEach(function(f){var t=gimg(f.archivo,420);if(!t)return;ph.set(f.id,{id:f.id,eventId:f.evento,authorId:f.autor,taggedId:f.etiquetado||null,thumb:t,createdAt:+f.creado||0});S.fullUrl.set(f.id,gimg(f.archivo,1100))});
 S.profiles=pm;S.admins=ad;S.contacts=ct;S.events=em;S.photos=ph;S.counts=r.counts||{};S.myVotesMap=r.myVotes||{};
 S.loaded=true;S.netErr='';S.cache={};
}
async function refresh(quiet){
 var r=await api({action:'state'});
 if(!r.ok){if(!S.loaded)S.netErr=r.error||'No se pudo cargar.';if(!quiet)render();return false}
 if(S.pending>0)return true;
 applyState(r);render();return true;
}
function boot(){
 render();
 if(!CFG.API||/PEGA|TU_URL/i.test(CFG.API)){S.fatal='Falta configurar la dirección de la hoja de Google (archivo config.js).';return render()}
 try{S.token=localStorage.getItem(TOKEN_KEY)||''}catch(e){S.token=''}
 if(!S.token){S.loaded=true;return render()}
 refresh();
 setInterval(function(){if(S.uid&&!document.hidden)refresh(true)},20000);
 document.addEventListener('visibilitychange',function(){if(S.uid&&!document.hidden)refresh(true)});
}
boot();
})();
</script>
